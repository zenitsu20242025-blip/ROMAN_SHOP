<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman — Order confirmed</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="brand">Roman</a>
    <nav class="nav-links">
      <a href="/#catalog">Catalog</a>
    </nav>
    <a href="/cart.html" class="cart-pill">Cart <span id="cart-count">0</span></a>
  </div>
</header>

<div class="wrap" style="padding: 64px 0;">
  <div class="panel" style="max-width: 560px; margin: 0 auto; text-align:center;" id="confirmation">
    Loading your order…
  </div>
</div>

<script src="/js/main.js"></script>
<script>
  updateCartCount();
  (async function () {
    const id = qs("order");
    const el = document.getElementById("confirmation");
    if (!id) { el.textContent = "No order reference found."; return; }
    const res = await fetch("/api/orders/" + id);
    if (!res.ok) { el.textContent = "We couldn't find that order."; return; }
    const order = await res.json();
    el.innerHTML = `
      <h1 style="font-size:26px; margin-bottom:12px;">Order received</h1>
      <p style="color:#6B6F6B;">Reference <strong>${order.id}</strong></p>
      <p style="margin:20px 0;">We've sent a confirmation to ${order.customer.email}. Your gear ships from our fulfillment partner within 1–2 business days.</p>
      <a href="/" class="btn">Back to catalog</a>
    `;
  })();
</script>
</body>
</html>
