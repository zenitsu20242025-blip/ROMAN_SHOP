<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman — Checkout</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="wrap">
  <div class="checkout-layout">
    <div>
      <h1 style="font-size:28px; margin-bottom:24px;">Delivery details</h1>
      <form id="checkout-form">
        <div class="form-grid">
          <div class="field"><label>First name</label><input name="firstName" required maxlength="25"></div>
          <div class="field"><label>Last name</label><input name="lastName" required maxlength="25"></div>
        </div>
        <div class="form-grid">
          <div class="field"><label>Email</label><input type="email" name="email" required maxlength="50"></div>
          <div class="field"><label>Phone (for the courier)</label><input name="phone" required maxlength="20"></div>
        </div>
        <div class="form-grid full">
          <div class="field"><label>Street address</label><input name="street" required maxlength="200"></div>
        </div>
        <div class="form-grid full">
          <div class="field"><label>Apartment, suite, etc. (optional)</label><input name="street2" maxlength="200"></div>
        </div>
        <div class="form-grid">
          <div class="field"><label>City</label><input name="city" required maxlength="50"></div>
          <div class="field"><label>State / Province / Region</label><input name="state" required maxlength="50"></div>
        </div>
        <div class="form-grid">
          <div class="field"><label>Postal code</label><input name="zip" required maxlength="20"></div>
          <div class="field"><label>Country</label>
            <select name="country" id="country-select" required style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--canvas);font-size:15px;"><option value="">Loading…</option></select>
          </div>
        </div>
        <p id="checkout-error" style="color:#BB4D2E;font-size:14px;margin:0 0 12px;display:none;"></p>
        <button class="btn" id="pay-btn" type="submit" style="width:100%;">Place order</button>
        <p style="font-size:13px; color:#6B6F6B; margin-top:12px;">
          Free shipping. Card details are handled by our payment provider and never stored on this site.
        </p>
      </form>
    </div>
    <div>
      <div class="panel" id="checkout-summary"><!-- filled by JS --></div>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">Roman. Orders ship from our fulfillment partner within 1–2 business days; delivery typically 7–12 days.</div>
</footer>

<script src="/js/main.js"></script>
<script>
  renderCheckoutSummary();
  handleCheckoutSubmit();
</script>
</body>
</html>
